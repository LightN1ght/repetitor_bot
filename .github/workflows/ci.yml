name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest --cov --cov-report=term-missing
      - name: Build package
        run: python -m build
      - name: Install and smoke-test wheel outside the checkout
        env:
          BOT_TOKEN: '123456789:offline-test-token'
          GEMINI_API_KEY: offline-test-key
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          from importlib.metadata import distribution
          from unittest.mock import AsyncMock, patch
          from repetitor_bot.bot import bot, dp

          entry_point = next(
              entry for entry in distribution("repetitor-bot").entry_points
              if entry.group == "console_scripts" and entry.name == "repetitor-bot"
          )
          with patch.object(dp, "start_polling", new_callable=AsyncMock) as polling:
              entry_point.load()()
              polling.assert_awaited_once_with(bot)
          PY
